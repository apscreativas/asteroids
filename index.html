<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* El fondo de la página continúa la nebulosa del canvas, así el juego
         no queda como una estampilla pegada sobre negro plano. */
      background:
        radial-gradient(ellipse at 20% 15%, rgba(86, 52, 168, 0.22), transparent 55%),
        radial-gradient(ellipse at 82% 85%, rgba(24, 92, 150, 0.20), transparent 55%),
        #04050a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      border-radius: 10px;
      border: 1px solid rgba(106, 168, 255, 0.22);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        0 24px 70px rgba(0, 0, 0, 0.75),
        0 0 90px rgba(106, 168, 255, 0.12);
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script src="game.js"></script>
</body>
</html>
